name: Release

# Manual trigger for now, so the build can be verified before wiring it to tags.
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Package
        run: tar -C target/aarch64-apple-darwin/release -czf markdown-style-aarch64-apple-darwin.tar.gz markdown-style

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: markdown-style-aarch64-apple-darwin
          path: markdown-style-aarch64-apple-darwin.tar.gz
