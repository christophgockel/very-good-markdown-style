name: Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: tar -C target/${{ matrix.target }}/release -czf markdown-style-${{ matrix.target }}.tar.gz markdown-style

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: markdown-style-${{ matrix.target }}
          path: markdown-style-${{ matrix.target }}.tar.gz

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          shasum -a 256 markdown-style-${{ matrix.target }}.tar.gz
          gh release upload "$TAG" markdown-style-${{ matrix.target }}.tar.gz --clobber

      # Only the Linux binary goes into the image, so only that target publishes.
      - name: Publish image
        if: runner.os == 'Linux' && github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository_owner }}/markdown-style"
          cp target/${{ matrix.target }}/release/markdown-style .
          docker build -t "$image:$TAG" -t "$image:latest" .
          docker push "$image:$TAG"
          docker push "$image:latest"
