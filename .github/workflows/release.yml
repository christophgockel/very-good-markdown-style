name: Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Package
        run: tar -C target/aarch64-apple-darwin/release -czf markdown-style-aarch64-apple-darwin.tar.gz markdown-style

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: markdown-style-aarch64-apple-darwin
          path: markdown-style-aarch64-apple-darwin.tar.gz

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          shasum -a 256 markdown-style-aarch64-apple-darwin.tar.gz
          gh release upload "$TAG" markdown-style-aarch64-apple-darwin.tar.gz --clobber
